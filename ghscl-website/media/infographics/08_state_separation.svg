<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#f1d78a"/><stop offset=".5" stop-color="#d1aa55"/><stop offset="1" stop-color="#8a611d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".55"/></filter></defs><rect width="1600" height="900" fill="#050505"/><path d="M0 120H1600M0 450H1600M0 780H1600M220 0V900M800 0V900M1380 0V900" stroke="#d4af5f" opacity=".07"/><g font-family="Arial,sans-serif" fill="#f6f1e7"><text x="90" y="92" font-size="26" letter-spacing="6" fill="#d4af5f">08 / STATE SEPARATION</text><text x="90" y="150" font-size="48" font-weight="700">One ecosystem, distinct decision states</text><g filter="url(#s)"><rect x="90" y="280" width="270" height="150" rx="24" fill="#0d0d0d" stroke="#d4af5f" stroke-opacity=".45"/><text x="225" y="350" text-anchor="middle" font-size="28" font-weight="700" fill="url(#g)">AUTHORITY</text><text x="225" y="389" text-anchor="middle" font-size="16" fill="#b8ac91">certification status</text></g><g filter="url(#s)"><rect x="390" y="280" width="270" height="150" rx="24" fill="#0d0d0d" stroke="#d4af5f" stroke-opacity=".45"/><text x="525" y="350" text-anchor="middle" font-size="28" font-weight="700" fill="url(#g)">AHTE TRUST</text><text x="525" y="389" text-anchor="middle" font-size="16" fill="#b8ac91">evidence/control state</text></g><g filter="url(#s)"><rect x="690" y="280" width="270" height="150" rx="24" fill="#0d0d0d" stroke="#d4af5f" stroke-opacity=".45"/><text x="825" y="350" text-anchor="middle" font-size="28" font-weight="700" fill="url(#g)">OPERATIONS</text><text x="825" y="389" text-anchor="middle" font-size="16" fill="#b8ac91">physical/custody state</text></g><g filter="url(#s)"><rect x="990" y="280" width="270" height="150" rx="24" fill="#0d0d0d" stroke="#d4af5f" stroke-opacity=".45"/><text x="1125" y="350" text-anchor="middle" font-size="28" font-weight="700" fill="url(#g)">CUSTOMS</text><text x="1125" y="389" text-anchor="middle" font-size="16" fill="#b8ac91">sovereign border state</text></g><g filter="url(#s)"><rect x="1290" y="280" width="220" height="150" rx="24" fill="#0d0d0d" stroke="#d4af5f" stroke-opacity=".45"/><text x="1400" y="350" text-anchor="middle" font-size="28" font-weight="700" fill="url(#g)">FINANCE</text><text x="1400" y="389" text-anchor="middle" font-size="16" fill="#b8ac91">external case state</text></g><path d="M90 520H1510" stroke="#d4af5f" opacity=".4"/><text x="800" y="610" text-anchor="middle" font-size="28" fill="#f0dfaf">No state silently overwrites another.</text></g></svg>