name: Deploy GHSCL website

on:
  workflow_run:
    workflows: ['Amanah CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pages: write
  id-token: write

concurrency:
  group: ghscl-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify current main and all exact-head CI checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_HEAD: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/verify-release-head.mjs
      - name: Build ecosystem site
        run: npm run web:build
      - name: Validate ecosystem site
        run: npm run web:lint
      - name: Build platinum homepage
        run: |
          npm install --prefix platinum-site --package-lock=false --no-audit --no-fund
          npm run build --prefix platinum-site
          npm run quality:budget --prefix platinum-site
          npm run quality:promotion --prefix platinum-site
      - name: Promote platinum full site into website artifact
        run: |
          rm -rf ghscl-website/assets
          cp -R platinum-site/dist/assets ghscl-website/assets
          for page in platinum-site/dist/*.html; do
            cp "$page" "ghscl-website/$(basename "$page")"
          done
          printf '%s\n' "PLATINUM_FULL_SITE=1" "RELEASE_HEAD=${{ github.event.workflow_run.head_sha || github.sha }}" > ghscl-website/platinum-release.txt
      - name: Apply controlling website brief to published artifact
        run: node scripts/build-trust-journey.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './ghscl-website'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify every current website page against deployed build
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-pages-deployment.mjs
