name: Deploy GHSCL website

on:
  push:
    branches: [main]
    paths:
      - 'ghscl-website/**'
      - '.github/workflows/ghscl-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ghscl-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './ghscl-website'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
