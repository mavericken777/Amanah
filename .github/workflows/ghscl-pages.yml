name: Deploy GHSCL website

on:
  push:
    branches: [main]
    paths:
      - 'ghscl-website/**'
      - 'scripts/build-ecosystem-site.mjs'
      - 'scripts/check-ecosystem-site.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ghscl-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ghscl-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build ecosystem site
        run: npm run web:build
      - name: Validate ecosystem site
        run: npm run web:lint
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: './ghscl-website'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
