name: Amanah CI

on:
  pull_request:
  push:
    branches: [main, "build/**", "sync/**"]

permissions:
  contents: read

concurrency:
  group: amanah-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run web:build
      - run: npm run web:lint
      - run: npm test

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/assurance/deno.json --node-modules-dir=auto supabase/functions/assurance/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/public-verify/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/ghscl-site/index.ts

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, test, edge-functions, reference-platform, reference-runtime, policies]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://lqvyyylrydcpjochknag.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  platinum-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install platinum foundation dependencies
        run: npm install --prefix platinum-site --package-lock=false --no-audit --no-fund
      - name: Build platinum Vite foundation
        run: npm run build --prefix platinum-site
      - name: Validate Phase 0 CSS safeguards
        run: |
          grep -q -- "--obsidian-base: oklch" platinum-site/src/styles/tokens.css
          grep -q "prefers-reduced-motion: reduce" platinum-site/src/styles/motion.css
          grep -q "prefers-reduced-transparency: reduce" platinum-site/src/styles/glass.css
          grep -q "@supports not (backdrop-filter" platinum-site/src/styles/glass.css


  platinum-quality:
    runs-on: ubuntu-latest
    needs: [platinum-foundation]
    timeout-minutes: 20
    env:
      PLAYWRIGHT_MODULE: /tmp/platinum-browser/node_modules/playwright/index.mjs
      AXE_PATH: /tmp/platinum-browser/node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Install platinum dependencies
        run: npm install --prefix platinum-site --package-lock=false --no-audit --no-fund
      - name: Build platinum site
        run: npm run build --prefix platinum-site
      - name: Enforce bundle and asset budgets
        run: npm run quality:budget --prefix platinum-site
      - name: Enforce promotion-readiness structure
        run: npm run quality:promotion --prefix platinum-site
      - name: Install pinned browser and accessibility tooling outside application dependencies
        run: |
          npm install --prefix /tmp/platinum-browser --no-audit --no-fund playwright@1.63.0 axe-core@4.10.3
          /tmp/platinum-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Responsive and accessibility browser validation
        run: |
          mkdir -p platinum-site/quality-results
          npm run preview --prefix platinum-site -- --host 127.0.0.1 --port 4173 > /tmp/platinum-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ >/dev/null || { cat /tmp/platinum-preview.log; exit 1; }
          node tests/platinum-browser-smoke.mjs
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Install pinned Lighthouse CI
        run: npm install --prefix /tmp/platinum-lhci --no-audit --no-fund @lhci/cli@0.14.0
      - name: Capture Lighthouse baseline and enforce thresholds
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: /tmp/platinum-lhci/node_modules/.bin/lhci autorun --config=platinum-site/lighthouserc.cjs
      - name: Upload Phase 0 quality evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platinum-phase0-quality-${{ github.sha }}
          path: |
            platinum-site/dist/
            platinum-site/quality-results/
            platinum-site/lighthouse-results/


  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 0.68.0
      - run: opa test -v reference-runtime/policies/
      - run: opa test -v reference-runtime/platform/policies/

  browser-smoke:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://lqvyyylrydcpjochknag.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      PLAYWRIGHT_MODULE: /tmp/amanah-browser/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run web:build && npm run build
      - name: Install pinned browser validation tool outside application dependencies
        run: |
          npm install --prefix /tmp/amanah-browser --no-audit --no-fund playwright@1.63.0
          /tmp/amanah-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Start isolated fixture servers and exercise website/protected routes
        run: |
          mkdir -p browser-results
          python3 -m http.server 8080 --bind 127.0.0.1 --directory ghscl-website > /tmp/amanah-site.log 2>&1 &
          npm start > /tmp/amanah-next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/login >/dev/null && curl -sf http://127.0.0.1:8080/index.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-${{ github.sha }}
          path: browser-results/

  reference-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r reference-runtime/platform/requirements.txt
      - run: python -m pytest -q reference-runtime/platform/tests

  reference-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 0.68.0
      - run: pip install -r reference-runtime/gateway/requirements.txt
      - name: Preserve canonical test paths in the relocated mirror
        run: ln -s . reference-runtime/runtime
      - name: Start fixture OPA
        run: |
          opa run --server --addr 127.0.0.1:8181 reference-runtime/policies/ > /tmp/amanah-opa.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8181/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/amanah-opa.log
          exit 1
      - name: Gateway guards and fixture pipeline
        working-directory: reference-runtime
        env:
          REQUIRE_OPA: '1'
          OPA_URL: http://127.0.0.1:8181/v1/data/halal/compliance
        run: |
          python -m pytest -q tests/test_edge_and_fsm.py tests/test_gateway_guards.py tests/e2e/test_shipment_pipeline.py
          python engine/verify_system.py
