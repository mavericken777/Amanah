name: Amanah CI

on:
  pull_request:
  push:
    branches: [main, "build/**", "sync/**"]

permissions:
  contents: read

concurrency:
  group: amanah-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run web:build
      - run: npm run web:lint
      - run: npm test

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/assurance/deno.json --node-modules-dir=auto supabase/functions/assurance/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/public-verify/index.ts
      - run: deno check --node-modules-dir=auto supabase/functions/ghscl-site/index.ts

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: open-policy-agent/setup-opa@v2
      - run: opa test -v reference-runtime/policies/
      - run: opa test -v reference-runtime/platform/policies/

  reference-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r reference-runtime/platform/requirements.txt
      - run: python -m pytest -q reference-runtime/platform/tests

  reference-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: open-policy-agent/setup-opa@v2
      - run: pip install -r reference-runtime/gateway/requirements.txt
      - name: Preserve canonical test paths in the relocated mirror
        run: cp -R reference-runtime/runtime . && cp -R reference-runtime/tests ./tests-canonical
      - name: Start fixture OPA
        run: |
          nohup opa run --server --addr 127.0.0.1:8181 reference-runtime/policies >/tmp/opa.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8181/health && break; sleep 0.5; done
      - name: Gateway guards and fixture pipeline
        run: |
          PYTHONPATH=reference-runtime pytest -q reference-runtime/tests/test_gateway_guards.py
          PYTHONPATH=reference-runtime OPA_URL=http://127.0.0.1:8181/v1/data/halal/compliance pytest -q reference-runtime/tests/e2e/test_shipment_pipeline.py

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, test, edge-functions, policies, reference-platform, reference-runtime]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
